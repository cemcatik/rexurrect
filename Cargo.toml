[package]
name = "rexurrect"
version = "0.1.0"
edition = "2024"
# The oldest Rust that builds every target. CI checks it.
rust-version = "1.89"
description = "Save Rex sessions and recreate them after the Rex server stops"
license = "MIT"
repository = "https://github.com/cemcatik/rexurrect"
homepage = "https://github.com/cemcatik/rexurrect"
readme = "README.md"
publish = false

[[bin]]
name = "rexurrect"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# rexurrect isn't published to crates.io, and dist reads `publish = false`
# as "don't distribute" unless told otherwise.
[package.metadata.dist]
dist = true

# The profile dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
