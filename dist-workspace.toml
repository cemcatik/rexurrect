[workspace]
members = ["cargo:."]

# Config for dist: https://axodotdev.github.io/cargo-dist
# The release workflow is generated from this: change it here, then run
# `dist generate`, never by editing .github/workflows/release.yml.
[dist]
# The dist version the release workflow uses
cargo-dist-version = "0.33.1"
ci = "github"
# Rex is macOS-only. Its `rex` is universal, so Intel Macs run it too.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
installers = ["shell", "homebrew"]
# The shell installer puts the binary where `cargo install` does, so
# switching between the two doesn't move what autosave and auto-restore run.
install-path = "CARGO_HOME"
install-updater = false
hosting = "github"
# The formula is published to the tap; prerelease tags don't update it.
tap = "cemcatik/homebrew-tap"
publish-jobs = ["homebrew"]
# In every archive. The formula installs it in share/rexurrect, where
# `rexurrect setup` finds it.
include = ["rexurrect.plugin.zsh"]
# So users can check a binary with `gh attestation verify`.
github-attestations = true

# The repository requires actions pinned to full commit SHAs. Update these
# along with cargo-dist-version: Dependabot leaves the release workflow alone.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
